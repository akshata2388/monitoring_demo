{% extends "base.html" %}
{% block title %}Sign in — Server Monitor{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <p class="lede">Monitoring pages require an admin session.</p>
  <form method="post" action="{{ url_for('login') }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
